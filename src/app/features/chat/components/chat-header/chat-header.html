<header
  class="border-slate-200/70 px-5 py-4 dark:border-slate-700/70 flex shrink-0 items-center justify-between border-b"
>
  <div class="min-w-0 gap-3 flex items-center">
    <div
      class="h-10 w-10 rounded-xl bg-primary text-white shadow-sm flex shrink-0 items-center justify-center"
      aria-hidden="true"
    >
      <mat-icon fontIcon="auto_awesome"></mat-icon>
    </div>

    <div class="min-w-0">
      <h1
        class="text-sm font-semibold text-slate-900 dark:text-slate-100 truncate"
      >
        Assistente
      </h1>

      <p class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">
        {{
          sending()
            ? 'Sta elaborando una risposta...'
            : 'Online e pronto ad aiutarti'
        }}
      </p>
    </div>
  </div>

  @if (sending()) {
    <div
      class="gap-2 text-xs font-medium text-primary flex items-center"
      aria-live="polite"
    >
      <mat-progress-spinner
        mode="indeterminate"
        diameter="16"
        strokeWidth="2"
      />

      <span class="sm:inline hidden">Elaborazione</span>
    </div>
  }
</header>
