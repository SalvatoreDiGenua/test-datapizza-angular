@if (citations().length) {
  <div
    class="mt-2 pl-1 flex items-center"
    aria-label="Citazioni della risposta"
  >
    @for (
      citation of visibleCitations();
      track citation.document_id + citation.page_number + citation.filename
    ) {
      <span
        class="-mr-1.5 size-8 font-bold tracking-tight text-on-primary shadow-sm flex shrink-0 items-center justify-center rounded-full border-2 border-[var(--sys-surface)] bg-primary text-[10px] uppercase"
        [matTooltip]="citation.filename"
        [attr.aria-label]="'Citazione: ' + citation.filename"
      >
        {{ citation.filename | getFileExtension }}
      </span>
    }

    @if (hasMoreCitations()) {
      <span
        class="-mr-1.5 size-8 bg-slate-200 text-xs font-bold text-slate-700 shadow-sm dark:bg-slate-700 dark:text-slate-100 flex shrink-0 items-center justify-center rounded-full border-2 border-[var(--sys-surface)]"
        [matTooltip]="'Altre ' + additionalCitationsCount() + ' citazioni'"
        [attr.aria-label]="'Altre ' + additionalCitationsCount() + ' citazioni'"
      >
        +
      </span>
    }
  </div>
}
