<form class="max-w-4xl gap-2 mx-auto flex w-full" (submit)="submit()">
  <mat-form-field class="chat__field flex-1" appearance="outline">
    <textarea
      matInput
      rows="3"
      [value]="draft()"
      [disabled]="disabled()"
      placeholder="Scrivi un messaggio..."
      aria-label="Messaggio"
      (input)="updateDraft($event)"
      (keydown)="handleKeydown($event)"
    ></textarea>

    <mat-hint class="sm:block hidden">
      Invio per inviare · Shift + Invio per andare a capo
    </mat-hint>
  </mat-form-field>

  <button
    mat-fab
    color="primary"
    [type]="disabled() ? 'button' : 'submit'"
    class="chat__send"
    [disabled]="disabled() ? false : !canSend()"
    [attr.aria-label]="disabled() ? 'Annulla invio' : 'Invia messaggio'"
    (click)="disabled() ? cancel() : null"
  >
    @if (disabled()) {
      <mat-icon>stop</mat-icon>
    } @else {
      <mat-icon>send</mat-icon>
    }
  </button>
</form>
