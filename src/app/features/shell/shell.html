<section class="shell">
  <mat-drawer-container class="shell__drawer-container" autosize>
    <mat-drawer
      [mode]="shellService.drawerMode()"
      [opened]="shellService.isDrawerOpen()"
    >
      <div class="flex h-full flex-col">
        <app-menu class="shell__menu grow" />
        <app-chat-history class="shell__chat-history grow" />
      </div>
    </mat-drawer>
    <mat-drawer-content class="shell__drawer-content">
      <div class="shell__main">
        <app-toolbar class="shell__toolbar" />
        <mat-card class="mx-6 mb-6 h-full" appearance="outlined">
          <router-outlet />
        </mat-card>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</section>
